phases:
  - id: phase-1
    title: "Phase 1: Auto-Triage"
    description: "MVP — Claude analyzes new issues, classifies them, labels, and responds with analysis or clarifying questions"
    duration: "1-2 sessions"

    features:
      - id: feature-1.1
        title: "Feature 1.1: Auto-analyze and respond to new issues"
        priority: 1
        user_story: "As an issue reporter, I want my issue automatically analyzed so that I get a fast, informed response with either a diagnosis or targeted clarifying questions"
        acceptance_criteria:
          - "New issue triggers automated analysis within minutes"
          - "Agent classifies issue as bug, feature request, or question"
          - "Agent applies appropriate label (bug, enhancement, question)"
          - "Agent comments with structured analysis: summary, relevant code locations, and next steps"
          - "If problem is unclear, agent asks specific clarifying questions instead of guessing"
        tracer_strategy:
          minimal_flow: "Issue opened → workflow triggers → claude-code-action analyzes → gh issue comment posts response"
          layers: "GitHub Actions trigger → claude-code-action → agent prompt → gh CLI"
          expansion: "Branch creation, @mention follow-up, cost monitoring (deferred to Phase 2)"
        blocks: ["feature-2.1"]
        bdd_tests:
          - test: "test_auto_triage"
            scenarios:
              - "new_issue_gets_analysis_comment"
              - "issue_classified_and_labeled"
              - "unclear_issue_gets_clarifying_questions"
              - "bot_created_issues_are_skipped"
        smoke_tests:
          - "gh issue create with clear bug description → verify analysis comment appears"
          - "gh issue create with vague description → verify clarifying questions appear"
          - "Verify issue gets appropriate label applied"

        tasks:
          - title: "Create issue-agent workflow with ADR-0013 hardening"
            priority: 1
            tracer: "Foundation — proves GitHub Actions triggers on issue events and runs claude-code-action"
            description: |
              - Create .github/workflows/issue-agent.yml
              - Trigger on issues: [opened]
              - Follow ADR-0013: explicit permissions (contents: read, issues: write), timeout-minutes, concurrency group
              - Configure claude-code-action step with claude_code_oauth_token
              - Set --max-turns 10 to cap usage
              - Add if: guard to skip bot-created issues (github.event.issue.user.type != 'Bot')
              - Minimal prompt: "Analyze this issue and comment with your findings"
            deliverable: ".github/workflows/issue-agent.yml with working trigger and basic response"
            reference: ".github/workflows/validate.yml for hardening patterns"
            tdd: true

          - title: "Write analysis prompt with classification and labeling"
            priority: 1
            depends_on: ["Create issue-agent workflow with ADR-0013 hardening"]
            tracer: "Intelligence layer — proves Claude can analyze issues, search codebase, and produce structured responses"
            description: |
              - Write automation prompt that instructs Claude to:
                1. Read the issue title and body
                2. Search the codebase for relevant code (Grep, Glob, Read)
                3. Classify as bug / feature request / question
                4. Apply label via gh issue edit --add-label
                5. Comment with structured analysis (summary, relevant files, diagnosis)
                6. If unclear: ask specific clarifying questions instead of guessing
              - Scope --allowedTools to: Read, Grep, Glob, Bash(gh issue:*), Bash(gh label:*)
              - Pass issue context via prompt interpolation (${{ github.event.issue.title }}, .body, .number)
            deliverable: "Complete automation prompt with classification, labeling, and structured response"
            tdd: true

          - title: "Add safety guards and loop prevention"
            priority: 1
            depends_on: ["Write analysis prompt with classification and labeling"]
            tracer: "Safety layer — proves the agent doesn't run on its own comments or spam issues"
            description: |
              - Add if: condition to skip issues from bots and the agent itself
              - Add concurrency group per issue number to prevent duplicate runs
              - Verify --max-turns caps session length
              - Test with edge cases: empty body, very long body, markdown-heavy body
            deliverable: "Hardened workflow that handles edge cases gracefully"
            tdd: true

  - id: phase-2
    title: "Phase 2: Fix Proposals & Follow-up"
    description: "Agent creates test branches for clear fixes and supports interactive @mention conversations"
    duration: "2-3 sessions"

    features:
      - id: feature-2.1
        title: "Feature 2.1: Propose fixes on test branches"
        priority: 1
        user_story: "As an issue reporter, I want the agent to propose a concrete fix on a test branch so that I can verify it works before it gets merged"
        acceptance_criteria:
          - "Agent creates a fix/issue-{number} branch when it identifies a clear code fix"
          - "Agent commits the fix with a descriptive message referencing the issue"
          - "Agent comments with: what was changed, branch name, checkout instructions, and request for verification"
          - "Agent only proposes fixes when confident — asks questions otherwise"
          - "Fix branches never auto-merge; always require human verification"
        tracer_strategy:
          minimal_flow: "Issue analyzed → fix identified → git checkout -b → edit files → git push → gh issue comment with instructions"
          layers: "Analysis prompt → git operations → comment template"
          expansion: "PR creation instead of branches, CI triggering on fix branches (deferred to Phase 3)"
        blocks: ["feature-2.2"]
        bdd_tests:
          - test: "test_fix_proposals"
            scenarios:
              - "clear_bug_gets_fix_branch"
              - "fix_comment_includes_checkout_instructions"
              - "ambiguous_issue_gets_questions_not_fix"
              - "fix_branch_follows_naming_convention"
        smoke_tests:
          - "gh issue create with reproducible bug → verify fix/issue-N branch is created"
          - "Verify fix branch comment includes checkout and test instructions"
          - "Verify fix branch has descriptive commit message"

        tasks:
          - title: "Extend allowedTools for git write operations"
            priority: 1
            tracer: "Capability layer — proves Claude can create branches and push code from CI"
            description: |
              - Add to --allowedTools: Bash(git checkout:*), Bash(git add:*), Bash(git commit:*), Bash(git push:*), Edit, Write
              - Add contents: write permission to workflow
              - Configure git user.name and user.email for commits (github-actions[bot])
              - Use fetch-depth: 0 in checkout step for full history
              - Test that branch creation and push works from the runner
            deliverable: "Workflow with git write capability, verified by test branch creation"
            reference: "Brainstorm architecture notes on GITHUB_TOKEN limitations"
            tdd: true

          - title: "Add fix-proposal logic to analysis prompt"
            priority: 1
            depends_on: ["Extend allowedTools for git write operations"]
            tracer: "Decision layer — proves Claude can distinguish fixable vs unclear issues and act accordingly"
            description: |
              - Extend prompt with fix-proposal instructions:
                1. After analysis, assess confidence: can this be fixed with a code change?
                2. If confident: create fix/issue-{number} branch, make changes, push
                3. If not confident: ask clarifying questions (existing behavior)
              - Add structured comment template for fix proposals:
                - What was changed and why
                - Branch name and checkout command
                - How to test the fix
                - Request for user verification
              - Include guardrail: never modify more than 3 files in a single fix (scope limit)
            deliverable: "Prompt that proposes fixes when confident, asks questions when not"
            tdd: true

      - id: feature-2.2
        title: "Feature 2.2: Interactive follow-up via @mention"
        priority: 2
        user_story: "As an issue participant, I want to @mention Claude in issue comments so that I can ask follow-up questions or provide additional context"
        acceptance_criteria:
          - "@claude mention in any issue comment triggers a response"
          - "Agent has context of the full issue thread (title, body, prior comments)"
          - "Agent can perform additional codebase analysis based on new information"
          - "Non-@claude comments are ignored (no spam)"
        tracer_strategy:
          minimal_flow: "Comment with @claude → workflow triggers → claude-code-action interactive mode → response comment"
          layers: "issue_comment trigger → @claude guard → claude-code-action interactive mode → gh CLI"
          expansion: "Cross-issue context, conversation memory (deferred)"
        bdd_tests:
          - test: "test_interactive_followup"
            scenarios:
              - "at_mention_triggers_response"
              - "non_mention_comments_ignored"
              - "response_uses_full_thread_context"
        smoke_tests:
          - "gh issue comment with @claude question → verify response comment appears"
          - "gh issue comment without @claude → verify no response"

        tasks:
          - title: "Add issue_comment trigger with @mention guard"
            priority: 1
            tracer: "Trigger layer — proves interactive mode activates only on @claude mentions"
            description: |
              - Add to workflow triggers: issue_comment: [created]
              - Add if: guard: contains(github.event.comment.body, '@claude')
              - Exclude bot comments to prevent loops
              - claude-code-action handles interactive mode automatically when triggered by comment events (no explicit prompt needed)
              - Verify context includes full issue thread
            deliverable: "Workflow responds to @claude mentions in issue comments"
            tdd: true

          - title: "Configure interactive mode tool scope"
            priority: 1
            depends_on: ["Add issue_comment trigger with @mention guard"]
            tracer: "Scope layer — proves interactive responses are safe and useful"
            description: |
              - Set --allowedTools for interactive mode (may differ from automation mode)
              - Interactive mode should have read-only + gh issue comment access
              - Optionally allow git operations if user asks for a fix in follow-up
              - Set --max-turns 8 for interactive (shorter than auto-triage)
              - Test conversation flow: question → response → follow-up
            deliverable: "Interactive mode with appropriate tool scoping"
            tdd: true

  - id: phase-3
    title: "Phase 3: Hardening & Generalization"
    description: "GitHub App identity for CI integration, and extraction into a reusable template for other repos"
    duration: "2-3 sessions"

    features:
      - id: feature-3.1
        title: "Feature 3.1: GitHub App identity for CI-triggering fix branches"
        priority: 2
        user_story: "As a maintainer, I want fix branches to trigger CI automatically so that I can see whether the proposed fix passes validation before reviewing it"
        acceptance_criteria:
          - "Fix branches pushed by the agent trigger the Validate workflow"
          - "Agent commits appear under a named bot identity, not github-actions[bot]"
          - "GitHub App credentials are securely stored and rotated"
        tracer_strategy:
          minimal_flow: "Create GitHub App → store credentials → use create-github-app-token in workflow → push triggers CI"
          layers: "GitHub App → actions/create-github-app-token → git push with app token → downstream workflow trigger"
          expansion: "Cross-repo App installation, audit logging (deferred)"
        blocks: ["feature-3.2"]
        bdd_tests:
          - test: "test_github_app_ci"
            scenarios:
              - "fix_branch_triggers_validate_workflow"
              - "commits_show_bot_identity"
              - "app_token_has_minimum_required_permissions"
        smoke_tests:
          - "Create fix branch via agent → verify Validate workflow runs on the branch"
          - "Check git log on fix branch → verify commit author is bot identity"

        tasks:
          - title: "Create GitHub App with minimum permissions"
            priority: 1
            tracer: "Identity layer — proves a named bot can authenticate and push"
            description: |
              - Create GitHub App in line-cook org/account
              - Minimum permissions: contents: write, issues: write, pull-requests: write
              - Generate private key
              - Store APP_ID and APP_PRIVATE_KEY as repo secrets
              - Document the App setup in README or docs
            deliverable: "GitHub App created with credentials stored as secrets"
            tdd: true

          - title: "Integrate create-github-app-token into workflow"
            priority: 1
            depends_on: ["Create GitHub App with minimum permissions"]
            tracer: "Auth layer — proves App token works for git push and triggers downstream CI"
            description: |
              - Add actions/create-github-app-token step before checkout
              - Pass generated token to checkout and git operations
              - Verify commits appear under App identity
              - Verify fix branch push triggers Validate workflow
              - Keep GITHUB_TOKEN as fallback for non-git operations (issue comments, labels)
            deliverable: "Workflow uses App token for git, GITHUB_TOKEN for GitHub API"
            tdd: true

      - id: feature-3.2
        title: "Feature 3.2: Reusable issue agent template"
        priority: 3
        user_story: "As a developer using line-cook on another repo, I want to install the issue agent from a template so that I get automated issue triage without building it from scratch"
        acceptance_criteria:
          - "Issue agent prompt lives in core/templates/ and syncs to plugin dirs"
          - "Installation instructions enable setup in under 5 minutes"
          - "Template works with any repo that has a CLAUDE.md (agent adapts to project context)"
          - "Configuration is minimal: just add OAuth token secret and copy workflow"
        tracer_strategy:
          minimal_flow: "Extract prompt to template → create install script/docs → test on a fresh repo"
          layers: "core/templates/ → sync script → plugins/ → user repo"
          expansion: "Spice packaging, marketplace listing, per-repo customization (deferred)"
        bdd_tests:
          - test: "test_reusable_template"
            scenarios:
              - "template_syncs_to_all_plugin_dirs"
              - "fresh_repo_install_works"
              - "agent_adapts_to_target_repo_claude_md"
        smoke_tests:
          - "Run sync script → verify template appears in all plugin dirs"
          - "Copy workflow + add secret to test repo → create issue → verify agent responds"

        tasks:
          - title: "Extract agent prompt to core/templates/"
            priority: 1
            tracer: "Template layer — proves prompt can be separated from workflow and synced"
            description: |
              - Move the analysis/fix-proposal prompt to core/templates/agents/issue-agent.md.template
              - Add platform conditionals if needed (@IF_CLAUDECODE@ etc.)
              - Update workflow to reference the prompt file (or inline during sync)
              - Run sync script and verify output in all plugin dirs
              - Ensure prompt is generic enough to work with any CLAUDE.md
            deliverable: "Agent prompt in template system, synced to plugin dirs"
            reference: "core/templates/agents/sous-chef.md.template for template pattern"
            tdd: true

          - title: "Create installation workflow and documentation"
            priority: 1
            depends_on: ["Extract agent prompt to core/templates/"]
            tracer: "Distribution layer — proves another repo can adopt the issue agent"
            description: |
              - Create a standalone workflow file that users copy to their repo
              - Write setup instructions: 1) copy workflow, 2) run claude setup-token, 3) add secret
              - Test on a fresh/test repository
              - Document configuration options (--max-turns, --allowedTools scope, model choice)
              - Consider whether this becomes a spice or stays as a workflow template
            deliverable: "Installable workflow + setup documentation"
            tdd: true
