phases:
  - id: phase-kiro-loop
    title: "Phase 1: Kiro Loop Support"
    description: "Make the autonomous line-loop work with Kiro CLI in addition to Claude Code CLI"
    duration: "2-4 sessions"

    features:
      - id: feature-1.1
        title: "Feature 1.1: Run autonomous loop with Kiro CLI"
        priority: 2
        user_story: "As a Line Cook user running Kiro CLI, I want to use @line-loop start so that I get the same autonomous batch execution that Claude Code users have"
        acceptance_criteria:
          - "Loop starts with --cli kiro and invokes kiro-cli instead of claude"
          - "All phases (cook, serve, tidy, plate, close-service) execute via Kiro"
          - "Signal detection works (KITCHEN_COMPLETE, SERVE_RESULT, KITCHEN_IDLE)"
          - "Tool action tracking works from Kiro plain-text output"
          - "Existing Claude loop behavior is unchanged (backward compatible)"
        tracer_strategy:
          minimal_flow: "CLI profile → build_phase_command() → subprocess kiro-cli → parse stdout → detect signal"
          layers: "config.py (profiles) → phase.py (invocation + parsing) → iteration.py (orchestration)"
          expansion: "Kiro hooks integration, session resume, OpenCode loop support"
        bdd_tests:
          - test: "TestFeature_KiroLoopSupport"
            scenarios:
              - "Acceptance_Criterion_1_Loop_starts_with_kiro_cli"
              - "Acceptance_Criterion_2_All_phases_execute_via_kiro"
              - "Acceptance_Criterion_3_Signal_detection_works"
              - "Acceptance_Criterion_4_Tool_action_tracking"
              - "Acceptance_Criterion_5_Claude_backward_compatible"
        smoke_tests:
          - "line-loop.py --cli kiro --max-iterations 1 starts kiro-cli subprocess"
          - "Signal KITCHEN_COMPLETE detected from Kiro output"
          - "line-loop.py (no --cli flag) still uses claude (backward compatible)"

        tasks:
          - title: "Add CLI profiles and Kiro output parser"
            priority: 1
            tracer: "Foundation — proves config-driven CLI selection and Kiro output parsing work"
            description: |
              config.py:
              - Add CLI_PROFILES dict with 'claude' and 'kiro' entries
              - Claude profile: binary='claude', prompt_format='/line:{phase}',
                permission_flags=['--dangerously-skip-permissions'],
                output_flags=['--output-format', 'stream-json', '--verbose'],
                has_streaming_json=True
              - Kiro profile: binary='kiro-cli', subcommand='chat',
                prompt_format='@line-{phase}',
                permission_flags=['--trust-all-tools'],
                extra_flags=['--no-interactive', '--wrap', 'never', '--agent', 'line-cook'],
                has_streaming_json=False
              - Add DEFAULT_CLI = 'claude'
              - Add get_cli_profile(name) → dict helper with KeyError on unknown CLI

              parsing.py:
              - Add strip_ansi(text) — regex to remove ANSI escape sequences
              - Add parse_kiro_tool_action(line) — extract tool name from '(using tool: <name>)' pattern
              - Add parse_kiro_tool_result(line) — detect success (checkmark) or failure (cross) patterns
              - Add extract_kiro_actions_from_line(line, pending_actions) → list[ActionRecord]
                to parallel extract_actions_from_event() for Kiro output

              Leave all existing Claude parsing functions unchanged.
            deliverable: "CLI profiles in config.py, Kiro parsers in parsing.py, with unit tests"
            tdd: true

          - title: "Refactor run_phase for CLI-agnostic invocation"
            priority: 1
            depends_on: ["Add CLI profiles and Kiro output parser"]
            tracer: "Core abstraction — proves phase execution works with any CLI profile"
            description: |
              phase.py:
              - Add build_phase_command(phase, args, cli_profile) → list[str]
                - Claude: ["claude", "-p", "/line:cook args", "--dangerously-skip-permissions",
                  "--output-format", "stream-json", "--verbose"]
                - Kiro: ["kiro-cli", "chat", "--no-interactive", "--trust-all-tools",
                  "--wrap", "never", "--agent", "line-cook", "@line-cook args"]
              - Add process_output_line(line, cli_profile, pending_actions) → tuple[list[ActionRecord], str]
                Returns (new_actions, cleaned_text).
                - When has_streaming_json: parse JSON event, extract actions, extract text
                - When not: strip ANSI, parse Kiro tool patterns, return cleaned line as text
              - Modify run_phase() signature: add optional cli_profile parameter
                - Default: None → get_cli_profile(DEFAULT_CLI) for backward compatibility
                - Replace hardcoded ["claude", ...] with build_phase_command()
                - Replace inline stream-json parsing loop with process_output_line()
                - Signal detection reads cleaned text (works for both CLIs)
                - For non-streaming CLIs: update last_action_time on any non-empty stdout
              - Stderr handling: always stderr=DEVNULL (already the case for Claude)

              CRITICAL: Zero call-site changes needed. Existing run_phase("cook", cwd) calls
              continue to work identically (defaults to Claude profile).
            deliverable: "CLI-agnostic run_phase() with build_phase_command() and process_output_line(), with unit tests"
            tdd: true

          - title: "Wire --cli flag through loop and CLI entry point"
            priority: 1
            depends_on: ["Refactor run_phase for CLI-agnostic invocation"]
            tracer: "Integration — proves end-to-end loop works with --cli kiro"
            description: |
              iteration.py:
              - Add cli_profile parameter to run_iteration() signature (default None)
              - Pass cli_profile to all run_phase() calls: cook, serve, tidy, plate, close-service
              - In check_epic_completion() where it calls run_phase("close-service"): accept and pass cli_profile

              loop.py:
              - Add cli_name parameter to run_loop() signature (default None → DEFAULT_CLI)
              - Resolve CLI profile at loop start via get_cli_profile(cli_name)
              - Pass cli_profile to run_iteration() calls
              - Pass cli_profile to any direct run_phase() calls in loop.py

              core/line-loop-cli.py:
              - Add --cli argument to argparse
                choices=list(CLI_PROFILES.keys()), default=DEFAULT_CLI
              - Pass args.cli to run_loop() as cli_name parameter
            deliverable: "--cli flag working end-to-end: CLI → loop → iteration → phase → subprocess"
            tdd: true

          - title: "Update loop command template to pass --cli flag"
            priority: 1
            depends_on: ["Wire --cli flag through loop and CLI entry point"]
            tracer: "Wrapper integration — proves @line-loop start invokes the correct CLI"
            description: |
              core/templates/commands/loop.md.template:
              - In the "Launch Background Loop" section, add --cli flag:
                - Claude Code (@IF_CLAUDECODE@): pass nothing (default is claude)
                - Kiro (@IF_KIRO@): pass --cli kiro
              - The template already uses @IF_KIRO@ conditionals — add --cli kiro
                inside the Kiro-specific launch block

              dev/sync-commands.sh:
              - Run sync to propagate template changes to all three plugin dirs
              - Verify plugins/kiro/prompts/line-loop.md includes --cli kiro

              Background execution for Kiro:
              - Kiro's shell tool may not support run_in_background like Claude Code
              - The template should use nohup + & for Kiro's launch command:
                nohup python3 <path> --cli kiro ... > $LOOP_DIR/loop.log 2>&1 &
                echo $! > $LOOP_DIR/loop.pid
              - Test: verify nohup process survives after shell tool call returns
              - If nohup doesn't work, document limitation and consider delegate tool

              Script discovery for Kiro:
              - Kiro prompt already has script discovery logic (find line-loop.py)
              - Verify it finds the script via either:
                a. plugins/claude-code/scripts/line-loop.py (shared bundle)
                b. core/line-loop-cli.py (development/source path)
              - If neither works, add scripts/line-loop.py symlink to plugins/kiro/
            deliverable: "Updated loop template with --cli kiro, synced to all plugins, background launch verified"
            tdd: true

          - title: "Re-bundle and verify backward compatibility"
            priority: 2
            depends_on: ["Update loop command template to pass --cli flag"]
            tracer: "Verification — proves bundled artifact works and nothing is broken"
            description: |
              - Run ./dev/release.py --bundle to regenerate plugins/claude-code/scripts/line-loop.py
              - Run full test suite: python3 -m unittest tests.test_line_loop -v
              - Verify: line-loop.py --help shows --cli flag with choices [claude, kiro]
              - Verify: line-loop.py (no --cli) defaults to claude (backward compat)
              - Verify: line-loop.py --cli kiro --max-iterations 0 exits cleanly (no crash)
              - Commit the bundled file and all changes
            deliverable: "Bundled line-loop.py with --cli support, all tests passing, committed"
            tdd: true
