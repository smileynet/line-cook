name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve, or why is it needed?
      placeholder: I'm always frustrated when ...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How should this work?
      placeholder: Describe the feature or behavior you'd like
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected Area
      options:
        - Commands / Slash Commands
        - Agents (issue-agent, inspector, etc.)
        - Workflow (loop, prep, cook, serve, tidy)
        - Templates / Sync
        - Beads (issue tracking)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches?
    validations:
      required: false
