name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `/command ...`
        2. Open file ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Claude Code (CLI)
        - OpenCode
        - Kiro
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Which version are you using? (e.g., v0.5.0)"
      placeholder: v0.x.x
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "OS, shell, or other relevant environment details"
      placeholder: "e.g., macOS 15, zsh, Node 22"
    validations:
      required: false
